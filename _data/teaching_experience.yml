- title: "China: K–12 Education and University Academic Support"
  body: >-
    In China, I gained teaching experience at three elementary schools, working with students of different ages and English proficiency levels. I designed and delivered English lessons using games, storytelling, phonics, and communicative activities to help students develop their language skills and build confidence in speaking English. I also adjusted my teaching methods based on students' learning needs and classroom performance. In addition to my K–12 teaching experience, I worked as a peer tutor and teaching consultant at a Sino-American university in China. I supported university students with academic writing, coursework, and learning strategies, helping them improve their academic English skills and become more independent learners.

- title: US Elementary Education
  site_label: School
  sites:
    - Andrew Hamilton Public School, Philadelphia, Pennsylvania
  body: >-
    At Andrew Hamilton Public School in Philadelphia, I worked with second-grade students to support their English literacy development, especially in reading and writing. I provided individualized instruction based on students' learning needs and used regular assessments to understand their progress. I also helped students with reading comprehension, vocabulary development, and writing activities. Through this experience, I learned how to adjust my teaching strategies for students with different learning abilities and create a supportive classroom environment where students feel comfortable participating and asking questions.

- title: US Adult ESL Education
  site_label: Teaching Site
  sites:
    - Queen Memorial Free Library, Philadelphia, Pennsylvania
  body: >-
    At Queen Memorial Free Library in Philadelphia, I teach English to adult immigrant learners from diverse linguistic and cultural backgrounds. My students have different English proficiency levels, so I design lessons that meet their learning needs and help them use English in everyday life. My lessons focus on practical situations, such as shopping, ordering food, healthcare, and public transportation. I use authentic materials, group discussions, and role-plays to encourage students to practice English in meaningful contexts. I also observe students' classroom performance and provide feedback to help them improve their communication skills. My goal is to create a learner-centered environment where adult learners can build confidence, develop their English proficiency, and use what they learn outside the classroom.
