    Teaching Experience:
      - bullet: >-
          **ESL Teacher — Free Library of Philadelphia, Queen Memorial Branch** · Philadelphia, United States · Sep 2026–Present (3 hours/week). Design and deliver learner-centered ESL lessons for adult immigrant learners using authentic materials such as menus, public service announcements, and local advertisements. Develop role-play activities for 12 common real-life scenarios, helping learners improve their communicative proficiency in everyday situations by more than 60%.

      - bullet: >-
          **Literacy Tutor — Andrew Hamilton Public School** · Philadelphia, United States · Feb 2026–Apr 2026 (4 hours/week). Completed regular training and provided one-to-one literacy tutoring to a second-grade student. Designed varied activities to strengthen the student's reading and writing skills.

      - bullet: >-
          **Online Tutor — PEDAL** · Philadelphia, United States · Apr 10, 2026 (90-minute session). Co-developed and delivered an online English lesson for adult immigrant learners with a University of Pennsylvania peer instructor. Reported lesson progress, student performance, and instructional outcomes to supervising instructors.

      - bullet: >-
          **Peer Tutor — Student Academic Support Service Center** · Wenzhou, China · Oct 2024–Jun 2025 (10–12 hours/week; more than 200 hours total). Completed regular training and provided one-to-one tutoring and supplemental instruction. Advised students on course planning, registration, graduation requirements, and changes of major.

      - bullet: >-
          **Pedagogical Consultant — EMSE 3420: Basic Theory and Practice for English Language Learners** · Wenzhou, China · Sep 2024–Dec 2024 (20 hours/month). Supported assignment distribution and revision, course design, pacing, and communication with peers about their understanding of course content. Tutored students before quizzes and exams and coordinated opportunities for them to teach children at Wenzhou-Kean University Affiliated Kindergarten.

      - bullet: >-
          **Student Teacher — Xinmin Primary School** · Yantai, China · Jun 2024–Jul 2024 (6 hours/day). Provided after-class, one-to-one oral English practice for 10 beginning learners. Conducted 40 ten-minute English interviews over four weeks; students progressed from having no spoken-English foundation to introducing their names and hobbies. Reduced quiz frequency and created a low-stress classroom environment with games, songs, and stories.

      - bullet: >-
          **Student Teacher — Instructional Skills Workshop at Wenzhou Shifulu Primary School and Wenzhou Guangchanglu Primary School** · Wenzhou, China · Feb 2024–May 2024 (46 hours total). Completed themed workshop sessions and delivered two English lessons, preparing lesson plans and teaching aids with a three-teacher team. Used communicative teaching methods for topics including animals, fruit, and time, integrating phonetics, vocabulary, phrases, and grammar.

      - bullet: >-
          **Tutor — Longkou No. 1 High School** · Yantai, China · Jun 2022–Aug 2022 (6 hours/day). Supported routine teaching, homework correction, instructional discussions, and lesson planning. Observed and analyzed students' learning status and shared feedback with lead teachers.

    Certification:
      - bullet: >-
          **Test for English Majors — Band 8 (TEM-8)** · Jul 2025. Passed China's highest-level English proficiency test for English majors.

      - bullet: >-
          **TESOL Advanced Certification — The American TESOL Institute** · Mar 2023. Completed 120 hours of classroom and online training plus 48 hours of real classroom practice.

    On-Campus Activities:
      - bullet: >-
          **Student Interviewer — Recruitment Committee** · Wenzhou, China · Mar 2025–Jun 2025. Represented students in interviews with incoming History Department faculty candidates and asked questions on students' behalf.

      - bullet: >-
          **College Student Assistant — Student Advisory Council** · Wenzhou, China · Nov 2021–Jun 2025. Supported daily teaching and exam invigilation and managed the council's public account to publish updates. Planned and delivered events on student rights, welfare, conflict resolution, and campus issues. Provided resources and guidance for resolving student conflicts in a healthy and productive way.

      - bullet: >-
          **College Student Assistant — College of Liberal Arts** · Wenzhou, China · Oct 2021–Jun 2025. Promoted the college and helped organize academic lectures and workshops. Translated a psychographics lecture and social media posts, interpreted speakers' presentations and reports, and facilitated student sharing during Open House. Filmed a promotional video for the School of English, supported the recording and upload of massive open online courses to the National Learning Platform, and helped maintain order at the Charity Gala.

    Extracurricular Activities:
      - bullet: >-
          **Simultaneous Interpreter — Sharing the Same Boat-Landscape Wenzhou Green Development Forum** · Wenzhou, China · Nov 2022. Interpreted during the Green Development Forum and its roundtable discussion, Green, Intelligence, Heritage-Driving Sustainable Urban Development in the Future. Received a letter of recommendation.

      - bullet: >-
          **Attendee — 2021 World Model United Nations** · Beijing, China · Aug 2021. Represented Indonesia in a four-day discussion on global climate development under the International Labour Organization and United Nations Environment Programme. Represented Norges Bank at a shareholders' meeting in a four-day discussion of Tesla's safe development.

    Volunteer Service:
      - bullet: >-
          **Core Member — Animal Care Group at Wenzhou-Kean University** · Wenzhou, China · Oct 2023–Jun 2025. Organized members to rescue and care for injured, sick, or malnourished animals and regularly conduct Trap-Neuter-Return activities. Responded to public reports of stray animals needing help. Organized adoption events and screened potential adopters to support responsible placements.

      - bullet: >-
          **Participant and Volunteer — United Nations Food Systems Summit 2021** · Nov 2021. Participated in a knowledge quiz, lectures, and volunteer activities and received certificates from the UN Food Systems Summit and the United Nations Children's Emergency Fund.

      - bullet: >-
          **Volunteer — Local Community and Yantai Center for Disease Control and Prevention** · Yantai, China · Jun 2021–Dec 2022. Supported public education on epidemic prevention and control. Assisted with personnel information collection, on-site coordination, and implementation of public-health measures. Participated in health and epidemic-control services, psychological counseling, and rescue activities.
