- id: communicative-language-teaching
  title: "Does Communicative Language Teaching Approach Influence English Second Language Proficiency? A Case Study at a Sino-US University in Wenzhou"
  project_period: "September 2023–March 2025"
  authors:
    - Leah Li Echiverri
    - Ke Wu
    - Ruowen Sun
    - Xinyue Zhao
  context_label: "Project advisor"
  context: "Leah Li V. Echiverri"
  summary: "This descriptive correlational study examined how six Communicative Language Teaching approaches relate to the speaking and listening proficiency of English learners at Wenzhou-Kean University. It focused on role-play, opinion sharing, language exchange, information-gap activities, group work, and scavenger hunts."
  contributions:
    - "Wrote the literature review."
    - "Designed questionnaires and interviewed 10 students."
    - "Conducted data analysis."
    - "Explored the classroom applications and advantages of information-gap and role-play approaches."
  publication:
    status: "Conference research and pre-recorded virtual presentation; an abstract is available, but no full paper was published."
    venue: "The Asian Conference on Education & International Development (ACEID2025)"
    date: "Abstract record published December 2, 2024"
    event_dates: "Conference held March 24–29, 2025"
    page_url: "https://papers.iafor.org/submission91475/"
    video_url: "https://vimeo.com/1065742429"

- id: ai-higher-education-literacy
  title: "Research on the Current Situation, Issues, and Countermeasures of AI Higher Education Literacy Training for Normal University Students: A Case Study of Wenzhou"
  project_period: "June–July 2024"
  authors:
    - Xinyun Jiao
    - Ruowen Sun
    - Yihan Ye
  context_label: "Project context"
  context: "Three-member group research"
  summary: "This study examined artificial intelligence literacy among normal university students in Wenzhou. It identified gaps in technical knowledge and practical application and proposed strengthening the curriculum and practice-based preparation for future educators."
  contributions:
    - "Wrote the literature review."
    - "Examined the advantages and disadvantages of AI and its applications across different fields."
    - "Visited local teacher-training and technical colleges and universities."
    - "Investigated how AI was being applied in teaching."
  publication:
    status: "Open-access conference proceedings article."
    venue: "Proceedings of the 2024 5th International Conference on Modern Education and Information Management (ICMEIM 2024)"
    date: "Published November 27, 2024"
    page_url: "https://www.atlantis-press.com/proceedings/icmeim-24/126005370"
    doi: "10.2991/978-94-6463-568-3_9"
    pdf_url: "https://www.atlantis-press.com/article/126005370.pdf"
