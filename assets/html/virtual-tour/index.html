<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interactive Virtual Campus Tour</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI", sans-serif;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #f7f9fc;
      }

      main {
        width: 100%;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      #h5p-container {
        width: 100%;
        min-height: 0;
      }

      .player-status {
        box-sizing: border-box;
        margin: 0;
        padding: 1rem;
        color: #334155;
        text-align: center;
      }

      .player-status--error {
        color: #8b1e1e;
      }

      .tour-mobile-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.5rem;
        padding: 0.75rem;
        background: #f7f9fc;
      }

      .tour-mobile-actions[hidden] {
        display: none;
      }

      .tour-mobile-actions button {
        min-height: 44px;
        padding: 0.65rem;
        border: 1px solid #8293aa;
        border-radius: 0.65rem;
        background: #ffffff;
        color: #334155;
        font:
          600 14px/1.4 Inter,
          "Segoe UI",
          sans-serif;
        overflow-wrap: anywhere;
        cursor: pointer;
      }

      .tour-mobile-actions button:focus-visible {
        outline: 3px solid #334155;
        outline-offset: 2px;
      }

      .tour-marker-letter {
        display: inline-grid;
        place-items: center;
        min-width: 1.5rem;
        height: 1.5rem;
        margin-right: 0.4rem;
        border-radius: 50%;
        background: #334155;
        color: white;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="sr-only">Virtual Tour at Wenzhou-Kean University</h1>
      <p id="player-status" class="player-status" role="status" aria-live="polite">Loading the interactive tour…</p>
      <div id="h5p-container" aria-describedby="player-status"></div>
      <nav id="tour-mobile-actions" class="tour-mobile-actions" aria-label="Current scene activities" hidden></nav>
      <noscript>
        <p class="player-status player-status--error">JavaScript is required to view this interactive tour.</p>
      </noscript>
    </main>

    <script src="../../vendor/h5p-standalone/3.8.2/main.bundle.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const container = document.getElementById("h5p-container");
        const status = document.getElementById("player-status");

        try {
          await new H5PStandalone.H5P(container, {
            h5pJsonPath: "../../h5p/virtual-tour",
            frameJs: "../../vendor/h5p-standalone/3.8.2/frame.bundle.js",
            frameCss: "../../vendor/h5p-standalone/3.8.2/styles/h5p.css",
            frame: true,
            copyright: false,
            export: false,
            icon: false,
            fullScreen: true,
            embed: false,
            reportingIsEnabled: false,
            postUserStatistics: false,
            saveFreq: false,
          });

          const playerFrame = container.querySelector("iframe");
          if (playerFrame && !playerFrame.title) playerFrame.title = "Virtual campus tour content";
          const installMobileStyles = () => {
            const frameDocument = playerFrame?.contentDocument;
            if (!frameDocument?.head || frameDocument.getElementById("portfolio-tour-mobile")) return;
            const stylesheet = frameDocument.createElement("link");
            stylesheet.id = "portfolio-tour-mobile";
            stylesheet.rel = "stylesheet";
            stylesheet.href = new URL("mobile.css?v=3", window.location.href).href;
            frameDocument.head.append(stylesheet);
            const actions = document.getElementById("tour-mobile-actions");
            const mobile = window.matchMedia("(max-width: 900px), (pointer: coarse)");
            let previousButtons = [];
            const updateActions = () => {
              const buttons = [
                ...frameDocument.querySelectorAll(
                  ".image-scene-wrapper .nav-button-wrapper > button.nav-button, .three-sixty-scene-wrapper .nav-button-wrapper > button.nav-button, .hud .nav-button-wrapper > button.nav-button, .h5p-go-back-button > button.nav-button"
                ),
              ];
              frameDocument.documentElement.classList.toggle("portfolio-mobile-controls", mobile.matches);
              actions.hidden = !mobile.matches;
              if (buttons.length === previousButtons.length && buttons.every((button, index) => button === previousButtons[index])) return;
              previousButtons = buttons;
              actions.replaceChildren();
              let markerIndex = 0;
              buttons.forEach((original) => {
                const button = document.createElement("button");
                const decoder = document.createElement("textarea");
                decoder.innerHTML = original.getAttribute("aria-label") || "View activity";
                button.type = "button";
                const isBack = original.closest(".h5p-go-back-button");
                const letter = isBack ? "←" : String.fromCharCode(65 + markerIndex++);
                if (!isBack) {
                  original.dataset.tourLetter = letter;
                  original.parentElement.classList.add("portfolio-letter-marker");
                }
                const badge = document.createElement("span");
                badge.className = "tour-marker-letter";
                badge.textContent = letter;
                button.append(badge, document.createTextNode(decoder.value));
                button.addEventListener("click", () => {
                  original.click();
                  container.scrollIntoView({ block: "start", behavior: "auto" });
                });
                actions.append(button);
              });
            };
            new MutationObserver(updateActions).observe(frameDocument.documentElement, { childList: true, subtree: true });
            mobile.addEventListener("change", updateActions);
            updateActions();
          };
          installMobileStyles();
          playerFrame?.addEventListener("load", installMobileStyles);
          status.hidden = true;
          container.removeAttribute("aria-describedby");
        } catch (error) {
          status.classList.add("player-status--error");
          status.textContent = "The interactive tour could not be loaded. Please refresh the page and try again.";
        }
      });
    </script>
  </body>
</html>
